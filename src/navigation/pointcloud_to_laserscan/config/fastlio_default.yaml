/**:
  ros__parameters:
    # Configuration for Point Cloud to Laser Scan conversion (FAST-LIO)
    #
    # This configuration converts 3D point clouds from FAST-LIO into 2D laser scans
    # suitable for Cartographer and other 2D SLAM algorithms.
    #
    # For robotics projects, typical configurations:
    # - Ground robot (height 0.1-0.5m): min_height=-0.2, max_height=0.2
    # - Aerial robot: min_height=-0.1, max_height=0.1
    # - Indoor robot: min_height=-0.15, max_height=0.15

    # Minimum height to consider in point cloud (meters)
    # OPTIMIZATION: Increased from -0.15 to capture more points above ground
    min_height: -0.25

    # Maximum height to consider in point cloud (meters)
    # OPTIMIZATION: Increased from 0.15 to capture more points
    max_height: 0.25

    # Minimum angle of laser scan (radians, -PI/2 to PI/2 typical)
    angle_min: -1.5708

    # Maximum angle of laser scan (radians)
    angle_max: 1.5708

    # Angular resolution (radians, typical: PI/360 = 0.0087 for 0.5 degree resolution)
    # OPTIMIZATION: Reduced from 0.0087 (0.5°) to 0.0044 (0.25°) for denser scan
    # This doubles the number of scan rays for more detailed mapping
    angle_increment: 0.0044

    # Scan time duration (seconds)
    scan_time: 0.1

    # Minimum range for valid laser measurements (meters)
    # OPTIMIZATION: Reduced from 0.5m to 0.2m to include nearby obstacles
    range_min: 0.2

    # Maximum range for laser measurements (meters)
    # Set based on your lidar specification (e.g., Livox Mid360: ~30m)
    # OPTIMIZATION: Increased from 30.0 to 35.0 for fuller range coverage
    range_max: 35.0

    # Target frame for coordinate transformation (typically base_link or lidar frame)
    target_frame: base_link

    # Transform timeout (seconds)
    transform_tolerance: 0.01

    # Use infinity for out-of-range points
    use_inf: true

    # Epsilon value for infinity representation
    inf_epsilon: 1.0

