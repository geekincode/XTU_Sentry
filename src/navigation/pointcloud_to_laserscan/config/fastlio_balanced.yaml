/**:
  ros__parameters:
    # Balanced laser scan configuration (default, recommended)
    # Good compromise between data density and computational efficiency
    #
    # Optimizations:
    # - Moderate angular resolution (0.5° standard)
    # - Standard height range for typical robots
    # - Typical range limits for Livox Mid360

    # Height range: standard for ground robots
    min_height: -0.15
    max_height: 0.15

    # Angle configuration: standard resolution
    angle_min: -1.5708
    angle_max: 1.5708
    angle_increment: 0.0087  # 0.5 degree

    # Range configuration: standard
    scan_time: 0.1
    range_min: 0.5
    range_max: 30.0

    # Frame settings
    target_frame: base_link
    transform_tolerance: 0.01

    # Infinity handling
    use_inf: true
    inf_epsilon: 1.0
